        created_at: { type: string, format: date-time }

    OrderDetailData:
      type: object
      properties:
        id: { type: integer, example: 1 }
        order_number: { type: string, example: 'INV-20261027-0001' }
        customer_id: { type: string, format: uuid, nullable: true }
        customer_name: { type: string, example: 'Pelanggan Umum' }
        created_by_name: { type: string, example: 'Kasir Utama' }
        order_date: { type: string, format: date-time }
        total_amount: { type: string, example: '44000.00' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemDetail' }
        activity_logs:
          type: array
          items: { $ref: '#/components/schemas/OrderActivityLogItem' }

    OrderDetailResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/OrderDetailData' }

    OrderListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/OrderDetailData' }
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DashboardSummaryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            period: { type: string, example: 'monthly' }
